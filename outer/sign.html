<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reddit Clone Authentication</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      color: white;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: -1;
    }

    .container {
      display: flex;
      width: 850px;
      background-color: rgba(255, 255, 255, 0.15);
      border-radius: 15px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    /* Left Reddit section */
    .reddit-section {
      flex: 1;
      background: linear-gradient(135deg, rgba(155, 89, 182, 0.85), rgba(142, 68, 173, 0.6));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px;
      text-align: center;
      color: white;
      position: relative;
      overflow: hidden;
    }

    .reddit-logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
      animation: float 3s ease-in-out infinite alternate;
    }

    .reddit-logo span {
      font-size: 50px;
      font-weight: bold;
      color: white;
    }

    @keyframes float {
      from { transform: translateY(0); }
      to { transform: translateY(-12px); }
    }

    .reddit-section h1 {
      font-size: 32px;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    .animated-text {
      font-size: 16px;
      opacity: 0.9;
      height: 24px;
      overflow: hidden;
      margin-top: 10px;
    }

    .animated-text span {
      display: inline-block;
      animation: fadeText 12s infinite;
    }

    @keyframes fadeText {
      0%, 20% { opacity: 0; transform: translateY(20px); }
      25%, 45% { opacity: 1; transform: translateY(0); }
      50%, 100% { opacity: 0; transform: translateY(-20px); }
    }

    /* Add glowing circles */
    .glow-circle {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      filter: blur(60px);
      animation: pulse 5s infinite alternate;
    }

    .glow-circle:nth-child(1) {
      top: 15%;
      left: 10%;
    }

    .glow-circle:nth-child(2) {
      bottom: 10%;
      right: 10%;
    }

    @keyframes pulse {
      from { transform: scale(1); opacity: 0.4; }
      to { transform: scale(1.3); opacity: 0.8; }
    }

    /* Right form section */
    .form-section {
      flex: 1;
      padding: 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-section h2 {
      margin-bottom: 25px;
      font-size: 28px;
      color: white;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 5px;
      font-size: 16px;
      background-color: rgba(255,255,255,0.3);
      color: white;
    }

    .form-group input:focus {
      border-color: white;
      outline: none;
    }

    .signup-btn, .login-btn {
      width: 100%;
      padding: 12px;
      background-color: rgba(155, 89, 182, 0.8);
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .signup-btn:hover, .login-btn:hover {
      background-color: rgba(142, 68, 173, 1);
    }

    .extra-links {
      text-align: center;
      margin-top: 15px;
    }

    .extra-links a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      margin: 0 5px;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }

    .message {
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
      text-align: center;
      display: none;
    }

    .success {
      background-color: rgba(46, 204, 113, 0.3);
      border: 1px solid rgba(46, 204, 113, 0.5);
    }

    .error {
      background-color: rgba(231, 76, 60, 0.3);
      border: 1px solid rgba(231, 76, 60, 0.5);
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        width: 90%;
      }

      .reddit-section, .form-section {
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <iframe src="https://my.spline.design/chips-wlNyhmMxkzRARPqVso6E9ljV/" frameborder="0"></iframe>

  <div class="container">
    <div class="reddit-section">
      <div class="glow-circle"></div>
      <div class="glow-circle"></div>
      <div class="reddit-logo"><span>R</span></div>
      <h1>Reddit Clone</h1>
      <div class="animated-text" id="animatedText">
        <span>Join vibrant communities 🌐</span>
      </div>
    </div>

    <div class="form-section">
      <h2 id="form-title">Create Your Account</h2>
      <div id="message" class="message"></div>
      <form id="authForm">
        <div class="form-group" id="fullname-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" placeholder="Enter your full name" />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Choose a username" />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Create a password" />
        </div>

        <div class="form-group" id="confirm-password-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm your password" />
        </div>

        <button type="submit" id="submit-btn" class="signup-btn">Sign Up</button>

        <div class="extra-links">
          <a href="#" id="toggle-link">Already have an account? Log in</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    // User data storage
    const USER_DATA_KEY = 'redditCloneUsers';
    
    // Initialize user data if not exists
    function initializeUserData() {
      if (!localStorage.getItem(USER_DATA_KEY)) {
        localStorage.setItem(USER_DATA_KEY, JSON.stringify([]));
      }
    }
    
    // Get all users
    function getUsers() {
      return JSON.parse(localStorage.getItem(USER_DATA_KEY)) || [];
    }
    
    // Save user
    function saveUser(user) {
      const users = getUsers();
      users.push(user);
      localStorage.setItem(USER_DATA_KEY, JSON.stringify(users));
    }
    
    // Find user by username
    function findUserByUsername(username) {
      const users = getUsers();
      return users.find(user => user.username === username);
    }
    
    // Find user by email
    function findUserByEmail(email) {
      const users = getUsers();
      return users.find(user => user.email === email);
    }
    
    // Validate user credentials
    function validateUser(username, password) {
      const user = findUserByUsername(username);
      if (!user) return false;
      return user.password === password;
    }
    
    // Show message - CORRECTED FUNCTION
    function showMessage(message, type) {
      const messageEl = document.getElementById('message');
      messageEl.textContent = message;
      messageEl.className = 'message ' + type; // Fixed this line
      messageEl.style.display = 'block';
      
      setTimeout(() => {
        messageEl.style.display = 'none';
      }, 5000);
    }
    
    // Toggle between login and signup forms
    function toggleForm() {
      const isLogin = document.getElementById('form-title').textContent === 'Log In';
      const formTitle = document.getElementById('form-title');
      const fullnameGroup = document.getElementById('fullname-group');
      const confirmPasswordGroup = document.getElementById('confirm-password-group');
      const submitBtn = document.getElementById('submit-btn');
      const toggleLink = document.getElementById('toggle-link');
      
      if (isLogin) {
        // Switch to signup
        formTitle.textContent = 'Create Your Account';
        fullnameGroup.style.display = 'block';
        confirmPasswordGroup.style.display = 'block';
        submitBtn.textContent = 'Sign Up';
        toggleLink.textContent = 'Already have an account? Log in';
      } else {
        // Switch to login
        formTitle.textContent = 'Log In';
        fullnameGroup.style.display = 'none';
        confirmPasswordGroup.style.display = 'none';
        submitBtn.textContent = 'Log In';
        toggleLink.textContent = "Don't have an account? Sign up";
      }
    }
    
    // Handle form submission
    function handleFormSubmit(e) {
      e.preventDefault();
      
      const isLogin = document.getElementById('form-title').textContent === 'Log In';
      const fullname = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();
      
      if (isLogin) {
        // Login logic
        if (!username || !password) {
          showMessage('⚠ Please fill in all fields!', 'error');
          return;
        }
        
        if (validateUser(username, password)) {
          showMessage('✅ Login successful! Redirecting...', 'success');
          // Get the full user data
          const user = findUserByUsername(username);
          // Store current user in sessionStorage and localStorage
          sessionStorage.setItem('currentUser', JSON.stringify(user));
          localStorage.setItem('currentUser', JSON.stringify(user));
          // Redirect to home page after successful login
          setTimeout(() => {
            window.location.href = 'deeppseeek.html'; // Redirect to your home page
          }, 1500);
        } else {
          showMessage('❌ Invalid username or password!', 'error');
        }
      } else {
        // Signup logic
        if (!fullname || !email || !username || !password || !confirmPassword) {
          showMessage('⚠ Please fill in all fields!', 'error');
          return;
        }
        
        // Validate email format
        const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
        if (!email.match(emailPattern)) {
          showMessage('⚠ Please enter a valid email address!', 'error');
          return;
        }
        
        // Password length
        if (password.length < 8) {
          showMessage('⚠ Password must be at least 8 characters long!', 'error');
          return;
        }
        
        // Password match
        if (password !== confirmPassword) {
          showMessage('⚠ Passwords do not match!', 'error');
          return;
        }
        
        // Check if username already exists
        if (findUserByUsername(username)) {
          showMessage('⚠ Username already exists!', 'error');
          return;
        }
        
        // Check if email already exists
        if (findUserByEmail(email)) {
          showMessage('⚠ Email already registered!', 'error');
          return;
        }
        
        // Save user
        const user = {
          id: Date.now().toString(), // Add unique ID
          fullname,
          email,
          username,
          password,
          createdAt: new Date().toISOString()
        };
        
        saveUser(user);
        showMessage('✅ Signup successful! Welcome to Reddit Clone 🎉', 'success');
        
        // Auto login after signup and redirect
        setTimeout(() => {
          sessionStorage.setItem('currentUser', JSON.stringify(user));
          localStorage.setItem('currentUser', JSON.stringify(user));
          window.location.href = 'deeppseeek.html'; // Redirect to home page after signup
        }, 1500);
        
        // Clear form
        document.getElementById('authForm').reset();
      }
    }
    
    // Initialize the application
    function init() {
      initializeUserData();
      
      // Animated text logic
      const texts = [
        "Join vibrant communities 🌐",
        "Share your ideas 💬",
        "Vote. Discuss. Connect. 🚀",
        "Your voice matters 🔥"
      ];
      let index = 0;
      const textElement = document.getElementById("animatedText").querySelector("span");
      
      setInterval(() => {
        textElement.style.opacity = 0;
        setTimeout(() => {
          index = (index + 1) % texts.length;
          textElement.textContent = texts[index];
          textElement.style.opacity = 1;
        }, 600);
      }, 3000);
      
      // Form event listeners
      document.getElementById('authForm').addEventListener('submit', handleFormSubmit);
      document.getElementById('toggle-link').addEventListener('click', function(e) {
        e.preventDefault();
        toggleForm();
      });
    }
    
    // Start the application when DOM is loaded
    document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
